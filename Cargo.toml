[package]
name = "blaze-html"
version = "0.1.0"
edition = "2021"

[dependencies]
lol_html = "2.5.0"
nom = "8.0.0"
serde_json = "1.x"

[dev-dependencies]
# Required for benchmarking
criterion = "0.5"
# Required for examples
axum = "0.7"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "template_bench"
harness = false

[[example]]
name = "axum_server"
path = "examples/axum_server.rs"
