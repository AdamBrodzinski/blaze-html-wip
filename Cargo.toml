[package]
name = "blaze-html"
version = "0.1.0"
edition = "2024"

[features]
default = ["cache-bust"]
cache-bust = ["blake3"]

[dependencies]
blake3 = { version = "1.8.3", optional = true }
nom = "8.0.0"
nom-language = "0.1.0"
serde_json = "1.x"

[dev-dependencies]
criterion = "0.5"
# example deps
axum = "0.8"
tokio = { version = "1", features = ["full"] }
indoc = "2.0.7"

[[bench]]
name = "template_bench"
harness = false

