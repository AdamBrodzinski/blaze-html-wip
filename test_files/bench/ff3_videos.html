<FF3Layout>
	<style>
		.Tutorials_background {
			background-image: url(/images/background-pink.png);
			background-size: 100% 100%;
			background-repeat: no-repeat;
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			height: 350px;
			z-index: 1;
		}
		.Tutorials {
			padding: 20px;
			max-width: 850px;
			margin: 0 auto;
		}
		.Tutorials input:focus {
			outline: none;
			transition: all 0.1s ease-in-out;
			box-shadow: 0 0 5px rgb(85 101 205);
		}
		.Tutorials input#search {
			width: 100%;
			padding: 15px 0 12px;
			padding-left: 24px;
			border: none;
			font-size: 14px;
			border-radius: 30px;
			@@media only screen and (max-width: 450px) {
				& {
					font-size: 16px;
				}
			}
		}
		.Tutorials [aria-role='toolbar'] {
			margin-top: 10px;
			padding: 0 20px;
		}
		.Tutorials .article {
			display: flex;
			padding: 20px;
			margin-bottom: 20px;
			text-decoration: none;
			border-radius: 16px;
			box-shadow: 0 0 15px rgb(0 0 0 / 9%);
			background-color: white;
			font-size: 15px;
			line-height: 1.4em;
		}
		.Tutorials .article > img {
			width: 18px;
			margin: 6px 17px 0 0;
			align-self: start;
		}
		.Tutorials .title {
			font-weight: 600;
			color: black;
		}
		.Tutorials a .chords,
		.Tutorials a .artist {
			color: #5c5c5c;
			font-size: 14px;
		}
		.Tutorials .container > p {
			margin-top: 44px;
		}
		.Tutorials p a {
			text-decoration: none;
			margin-top: 7px;
			display: inline-block;
		}
		.Tutorials .perks {
			font-weight: 600;
			margin-right: 5px;
		}
		.Tutorials .videos-header {
			display: flex;
			margin-bottom: 26px;
			color: #777;
			font-size: 14px;
		}
		.Tutorials .filters {
			flex: 1;
		}
		.Tutorials .filters label {
			margin-right: 15px;
		}
	</style>
	<div class="Tutorials_background">
		<style>
			.Header {
				display: flex;
				padding: 20px;
				max-width: 850px;
				margin: 0 auto;
			}
			.Header .logo-link {
				padding: 1px 16px 0 14px;
				border-radius: 31px;
			}
			.Header img {
				margin-top: 8px;
			}
			.Header .divider {
				flex: 1;
			}
			.Header button {
				width: 52px;
				height: 52px;
				border-radius: 16px;
				box-shadow: 0 0 16px rgb(0 0 0 / 8%);
				background: white;
				padding: 7px 16px 0;
				border: none;
				&:hover {
					box-shadow: 0 0 16px rgb(0 0 0 / 20%);
				}
				&:active {
					box-shadow: 0 0 10px rgb(0 0 0 / 16%);
				}
				&:is(:focus, :focus-visible) {
					transition: all 0.1s ease-in-out;
					box-shadow: 0 0 5px 1px rgb(85 101 205) !important;
				}
				.line {
					border-bottom: 2px solid #baaeae;
					margin-bottom: 5px;
				}
			}
			#Header_nav-wrapper {
				position: fixed;
				z-index: 1;
				top: 0;
				bottom: 0;
				/* enables wrapper to slide out of view when hidden */
				right: 0;
				width: 100%;
				transition: opacity 0.25s ease;
				/* also faded nav */
				&.hidden {
					right: -100vw;
					opacity: 0;
				}
			}
			#Header_nav-wrapper nav {
				position: fixed;
				z-index: 10;
				top: 0;
				right: 0;
				width: 275px;
				height: 100%;
				padding: 10px 30px;
				background: white;
				box-shadow: -8px 0 27px 0 #00000069;
				transition: all 0.25s ease;
			}
			&.hidden nav {
				right: -275px;
			}
			#Header_nav-wrapper nav li {
				margin-bottom: 20px;
			}
			#Header_nav-wrapper nav a {
				display: block;
				color: #5465ce;
				text-decoration: none;
				/* override Course styles */
				font-size: 22px;
				text-align: unset;
				padding: 3px 14px;
				border-radius: 20px;
			}
			#Header_nav-wrapper nav a:hover {
				color: #39448f;
			}
			#Header_nav-wrapper .close {
				text-align: right;
				font-size: 20px;
				margin: -2px -9px 30px 0;
			}
			#Header_nav-wrapper .close button {
				display: inline-block;
				padding: 10px 15px;
				font-size: 20px;
				border: 0;
				background: none;
				cursor: pointer;
				border-radius: 20px;
			}
			#Header_nav-wrapper .close button:focus {
				outline: none;
				box-shadow: 0 0 5px 1px rgb(85 101 205) !important;
				transition: all 0.1s ease-in-out !important;
			}
		</style>
		<header class="Header" data-hx-boost="true">
			<a href="/" class="logo-link" aria-label='Home page link' preload=mouseover preload-images='true' data-hx-swap="innerHTML transition:true">
				<picture>
					<source srcset="/images/logo.webp" type="image/webp">
					<img src="/images/logo.png" alt="forever faithful logo" width="163" height="32">
				</picture>
			</a>
			<div class="flex_1"></div>
			<button id="burgerBtn" class="button" onclick="toggleShow('#Header_nav-wrapper')" aria-label='Name'>
				<div class="line"></div>
				<div class="line" style="width: 80%;"></div>
				<div class="line"></div>
			</button>
		</header>
		<div id="Header_nav-wrapper" inert class="hidden" onclick="toggleShow('#Header_nav-wrapper')">
			<nav onclick="event.stopPropagation()">
				<div class="close"><button id="modalCloseBtn" onclick="toggleShow('#Header_nav-wrapper')">✕</button></div>
				<ul data-hx-boost="true" data-hx-swap="innerHTML transition:true" preload-images='true'>
					<li><a href="/" preload>Home</a></li>
					<li><a href="/courses" preload>Courses</a></li>
					<li><a href="/tutorials" preload>Tutorials</a></li>
					<li><a href="/tutorials?pg=on" rel="nofollow" preload>Printable Guides</a></li>
					<li><a href="/tutorials?pb=on" rel="nofollow" preload>Backing Tracks</a></li>
					<li><a href="https://for3v3rfaithful-merch-store.creator-spring.com" target="_blank">Merch</a></li>
					<li><a href="https://www.patreon.com/for3v3rfaithful" target="_blank">Patreon</a></li>
					<li><a href="/media" id="nav-last">Media/Articles</a></li>
				</ul>
			</nav>
		</div>
		<div class="Tutorials" id="Tutorials">
			<section>
				<form id="tutorials-form" type="search" name="search" data-hx-get="tutorials" data-hx-target="#tutorials-container" data-hx-select="#tutorials-container" data-hx-swap="outerHTML" data-hx-trigger="submit, keyup delay:250ms" data-hx-push-url="true">
					<input autocomplete="off" id="search" name="q" placeholder="Search tutorials" aria-role='toolbar' value>
					<span class="videos-header" aria-role='toolbar'>
						<div class="filters"><b class="perks">Patreon Perks:</b>
						<label for="playalong"><input id="playalong" name="pp" type="checkbox" data-hx-get="tutorials" data-hx-target="#tutorials-container" data-hx-select="#tutorials-container" data-hx-swap="outerHTML" data-hx-trigger="change" data-hx-push-url="true">
						Play-Along</label>
						<label for="guides"><input id="guides" name="pg" type="checkbox" data-hx-get="tutorials" data-hx-target="#tutorials-container" data-hx-select="#tutorials-container" data-hx-swap="outerHTML" data-hx-trigger="change" data-hx-push-url="true">
						Guitar Guide</label>
						<label for="backing-track"><input id="backing-track" name="pb" type="checkbox" data-hx-get="tutorials" data-hx-target="#tutorials-container" data-hx-select="#tutorials-container" data-hx-swap="outerHTML" data-hx-trigger="change" data-hx-push-url="true">
						Backing Track</label></div>
						<div class="video-count" id="video-count">292 Videos</div>
					</span>
				</form>
			</section>
			<main id="tutorials-container" data-hx-boost="true">
				<Each items="@videos" as="video">
					<a href="@video.link" role="article" class="article" preload preload-images='true' data-hx-swap="innerHTML transition:true">
						<img src="/images/icons/pink-note.svg" alt="pink note icon">
						<div>
							<div class="title">@video.title</div>
							<div class="artist">@video.artist</div>
							<div class="chords">@video.chords</div>
						</div>
					</a>
				</Each>
			</main>
			<p class="text-align_center">Can't find a song you're looking for? <a href="/">Request a song!</a></p>
		</div>
	</div>
	<script>
		function toggleShow(id) {
			const el = document.querySelector(id);
			if (!el) {
				console.log(`toggleShow could not find element: ${id}`);
				return
			}
			if (el.classList.contains("hidden")) {
				el.classList.remove('hidden');
				el.inert = false;
				} else {
					el.classList.add("hidden");
					el.inert = true;
				}
			}
	</script>
</FF3Layout>
